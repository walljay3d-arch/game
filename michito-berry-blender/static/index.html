<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Michito Berry Blender</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Outfit:wght@400;600;700;800;900&display=swap');
:root{--purple:#a88cff;--gold:#f5c968;--paper:#f5f0ff;--muted:#b5a5d1;--pink:#f7a7d7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#42236b 0%,#20132f 52%,#130f1f 100%);background-attachment:fixed;color:var(--paper);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:26px 22px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.eyebrow{letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:900;font-size:11px}.brand{font-family:Outfit,system-ui;font-size:clamp(27px,4.5vw,52px);font-weight:900;line-height:1.03;margin:9px 0}.sub{color:#cbbbdc;line-height:1.55}.panel{background:linear-gradient(135deg,rgba(104,65,143,.28),rgba(43,31,66,.85));border:1px solid rgba(236,208,255,.2);border-radius:24px;padding:23px;box-shadow:0 18px 60px #09041133}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.btn{border:0;border-radius:15px;padding:13px 21px;background:linear-gradient(135deg,#fce09b,#e8b654);font-weight:900;color:#39234a;cursor:pointer;font-size:15px;box-shadow:0 6px 20px #10081844}.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#5b4480;color:white;border:1px solid #9278bd;box-shadow:none}.btn.danger{background:#653d66;color:#ffe5ff}.pill{background:#5c3c80;color:#fff;border:1px solid #9475b6;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:900;letter-spacing:.08em}.small{font-size:13px;color:#cbb9db}.list{display:grid;gap:9px;margin-top:17px}.person{display:flex;align-items:center;gap:11px;background:#ffffff0b;border:1px solid #ffffff14;border-radius:13px;padding:10px 13px}.dot{width:13px;height:13px;border-radius:50%;flex:none}.name{font-weight:900;flex:1}.ready{font-size:11px;font-weight:800;color:#f2cc7f}.qrarea{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.qr{background:white;border-radius:14px;padding:10px;width:154px;height:154px}.qr img{width:100%;height:100%}.code{font-family:Outfit;font-size:clamp(44px,7vw,78px);font-weight:900;letter-spacing:.13em;line-height:1.1;color:var(--gold)}h2{font-family:Outfit;font-size:26px;margin:0 0 13px}.divider{border-top:1px solid #ffffff20;margin:22px 0}.recipe{background:#4d356b70;border-radius:16px;padding:17px;border:1px solid #af8bb744}.recipe strong{color:var(--gold)}.berry-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.berry{border:1px solid #8e70af;background:#ffffff0e;border-radius:14px;padding:13px 4px;color:#f5effc;cursor:pointer;font:inherit;min-height:94px}.berry b{display:block;margin-top:6px;font-size:12px}.berry small{font-size:10px;color:#ccb6e6}.berry.on{outline:3px solid var(--gold);background:#7a5a9f}.berry .emoji{font-size:30px}.control{width:100%;max-width:440px;margin:0 auto;text-align:center}.input{width:100%;padding:14px;border-radius:12px;background:#281c3b;border:1px solid #9370b5;color:white;font-size:16px;margin:10px 0 14px}.game-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.arena{position:relative;max-width:600px;margin:auto;aspect-ratio:1}.arena svg{width:100%;height:100%;overflow:visible}.arrow{transform-origin:200px 200px;transform:rotate(0deg)}.game-title{text-align:center;color:var(--gold);font-family:Outfit;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#ffffff13;padding:12px 4px;border-radius:12px}.stat strong{display:block;font-size:26px;color:var(--gold);font-family:Outfit}.stat span{font-size:11px;color:#d7c7e8}.log{max-height:210px;overflow:auto;display:grid;gap:6px}.log div{padding:8px 10px;border-radius:8px;background:#ffffff0c;font-size:13px}.bigpress{border:0;border-radius:50%;width:min(66vw,250px);height:min(66vw,250px);background:radial-gradient(circle at 35% 20%,#ffe7a9,#f1b64e 65%,#b96b3e);box-shadow:0 14px 0 #734464,0 30px 55px #07040a99;color:#39234a;font-family:Outfit;font-size:clamp(34px,9vw,56px);font-weight:900;touch-action:manipulation;cursor:pointer;user-select:none}.bigpress:active:not(:disabled){transform:translateY(9px);box-shadow:0 5px 0 #734464,0 10px 20px #07040a99}.bigpress:disabled{filter:grayscale(.65);opacity:.5;cursor:default}.center{text-align:center}.result{font-family:Outfit;font-size:clamp(34px,6vw,74px);font-weight:900;color:var(--gold)}.tag{display:inline-block;padding:8px 13px;border-radius:30px;background:#73559e;margin:5px;font-size:12px;font-weight:800}.hidden{display:none!important}.footer{margin-top:30px;text-align:center;font-size:12px;color:#87769c}a{color:#ffdb96}.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{to{filter:brightness(1.4);transform:scale(1.04)}}@media(max-width:750px){.cols,.game-layout{grid-template-columns:1fr}.wrap{padding:19px 14px 55px}.panel{padding:17px}.berry-grid{gap:5px}.berry{padding:9px 2px}.berry .emoji{font-size:25px}.arena{max-width:450px}}
 .musicbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.musicbtn{background:#7050a1;border:1px solid #ab88df;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.musicbtn.on{background:#976c42;border-color:#f5c968}.select{width:100%;max-width:380px;margin:6px 0 14px;border:1px solid #a889d6;border-radius:12px;background:#2f2149;color:white;padding:12px;font-size:15px}.practiceNotice{background:#443460;border:1px solid #d7b777;border-radius:13px;padding:13px;margin:14px 0;color:#ffe5a1;font-weight:800}.lap{color:#f5c968;font-weight:900;font-size:14px;text-align:center;margin:4px 0 12px}.answer{margin:14px auto;padding:12px;border-radius:12px;background:#412b60;max-width:650px} .stage-only{display:none}body.stage .stage-hide{display:none!important}body.stage .musicbar{display:flex}.pokegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:13px}.pokechoice{background:#ffffff10;border:2px solid #73518f;border-radius:17px;color:white;padding:15px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;cursor:pointer}.pokechoice:disabled{filter:grayscale(1);opacity:.3;cursor:not-allowed;border-color:#6a6070}.pokechoice.selected{border-color:#f5c968;background:#9c7bc044}.pokechoice b{font-size:17px}.pokeartwrap{display:flex;justify-content:center;align-items:center;min-height:125px}.pokeartwrap img{object-fit:contain;width:100%;max-width:125px;height:125px;filter:drop-shadow(0 10px 8px #0005)}.heroart img{height:230px;max-width:220px}.heroart{min-height:230px}.linkbox{overflow-wrap:anywhere;background:#20152d;border:1px solid #695488;border-radius:10px;padding:10px;margin:8px 0;font-size:12px;color:#edd7fd}.stage-only{display:block}body{overflow-x:hidden}.helpbox{background:#2a2246;border:1px solid #b99bda;border-radius:15px;padding:14px;margin:16px 0;line-height:1.6}.helpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:12px 0}.helpitem{padding:9px;background:#52366b;border-radius:11px}.soundstatus{font-size:12px;color:#e2c9ff}</style></head><body><div class="wrap"><header class="top"><div><div class="eyebrow">Jessica Billy Presents • Michito Resort</div><div class="brand">✦ BERRY BLENDER ✦</div><div class="sub">The sweet, the sour, and the spectacular.</div></div><div class="musicbar"><button id="music-toggle" class="musicbtn" onclick="toggleMusic()">♫ Mute music</button><button class="musicbtn" onclick="primeStage()">🔊 Activate TV audio</button><span class="pill" id="connection">CONNECTING...</span></div></header><main id="main" style="margin-top:24px"></main><div class="footer">SHOWTIME BADGE • MICHITO RESORT GYM • FAN-MADE TABLETOP MINIGAME</div></div><script>const q=new URLSearchParams(location.search),mode=location.pathname==='/jessica'?'jessica':location.pathname==='/play'?'player':location.pathname==='/stage'?'stage':'owner';
let room=q.get('room')||'',key=q.get('key')||'',playerId=sessionStorage.getItem('berry-id-'+room)||'',state=null,ws=null,active='',angle=0,spinning=false,lastPress='',lastHit='',lastRevolution=-1,playing=false,ctx=null,musicTimer=null,musicStep=0,autoMusic=true,audioPrimed=false,winPlayedFor='';
const $=s=>document.getElementById(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sprite=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`,cry=id=>`https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${id}.ogg`;
const B=[['cheri','🍒','Cheri','Spicy'],['chesto','🫐','Chesto','Dry'],['pecha','🍑','Pecha','Sweet'],['rawst','🌿','Rawst','Bitter'],['aspear','🍋','Aspear','Sour'],['oran','🫐','Oran','Mixed'],['sitrus','🍋','Sitrus','Mixed']];
const MUSIC=[76,79,83,79,81,84,88,84,79,83,86,83,76,79,83,88,74,78,81,78];
function unlock(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;ctx??=new A();ctx.resume();return true}
function tone(m,d=.15,v=.08,offset=0,type='sine'){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+offset;o.type=type;o.frequency.setValueAtTime(440*2**((m-69)/12),t);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}
function sound(type){if(!unlock())return;if(type==='WIN'){[72,76,79,84,88].forEach((n,i)=>tone(n,.35,.11,i*.11,'triangle'));return}if(type==='PERFECT'){tone(83,.12,.12);tone(88,.16,.13,.085);tone(95,.22,.15,.17)}else if(type==='GOOD'){tone(76,.12,.09);tone(81,.18,.09,.1)}else if(type==='MISS')tone(48,.27,.035,0,'sawtooth')}
function musicBeat(){if(!playing||!ctx)return;let i=musicStep++;tone(MUSIC[i%MUSIC.length],.17,.018,0,'square');if(i%2===0)tone([48,53,55,50][Math.floor(i/4)%4],.26,.03,0,'triangle')}
function setMusic(on){playing=on;if(musicTimer)clearInterval(musicTimer);if(on){unlock();musicStep=0;musicBeat();musicTimer=setInterval(musicBeat,240)}if($('music-toggle'))$('music-toggle').textContent=playing?'♫ Music ON · Mute':'♫ Enable music'}
function toggleMusic(){audioPrimed=unlock();autoMusic=!autoMusic;if(['practice','blending'].includes(state?.status))setMusic(autoMusic);else $('music-toggle').textContent=autoMusic?'♫ Sound ready (auto-play)':'♫ Sound muted'}
function playCry(p){if(!p?.ids?.length)return;let count=0;for(const id of p.ids){const a=new Audio(cry(id));a.volume=.75;setTimeout(()=>a.play().catch(()=>{}),count++*900)}}
const art=(p,cls='pokeart')=>`<div class="pokeartwrap ${cls}">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.nickname)}">`:p.ids.map(id=>`<img src="${sprite(id)}" alt="${esc(p.name)}">`).join('')}</div>`;
const sel=()=>state?.pokemon;
function send(action,data={}){if(ws?.readyState===1)ws.send(JSON.stringify({action,...data}))}
function joinUrl(){return location.origin+'/play?room='+room}function stageUrl(){return location.origin+'/stage?room='+room}function jessicaUrl(){return location.origin+'/jessica?room='+room+'&key='+encodeURIComponent(state?.jessicaKey||'')}
function connect(){ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?role=${mode}&room=${encodeURIComponent(room)}&token=${encodeURIComponent(playerId)}&key=${encodeURIComponent(key)}`);ws.onopen=()=>{$('connection').textContent='● CONNECTED'};ws.onclose=()=>{$('connection').textContent='● OFFLINE';setTimeout(connect,2500)};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error'){$('main').innerHTML=`<section class="panel">${esc(d.message)}</section>`;return}if(d.type==='hello'){room=d.room;if(d.ownerKey){key=d.ownerKey;history.replaceState(null,'',`/control?room=${room}&key=${encodeURIComponent(key)}`)}if(mode==='player'){playerId=d.id;sessionStorage.setItem('berry-id-'+room,playerId)}}if(d.type==='state'){const prev=state?.status;state=d;if(prev!==d.status){if(['practice','blending'].includes(d.status)&&autoMusic&&mode==='stage'&&audioPrimed)setMusic(true);else if(playing&&!['practice','blending'].includes(d.status))setMusic(false);if(d.status==='pokemon_result'&&prev!==d.status&&mode==='stage'&&d.result?.recipeSuccess){let token=d.room+'-'+d.showRound;if(winPlayedFor!==token){winPlayedFor=token;sound('WIN')}}}render()}if(d.type==='countdown'&&mode==='stage')sound('GOOD');if(d.type==='tick'){angle=d.angle;spinning=d.running;updateSpinner()}if(d.type==='hit'){if(mode==='stage')sound(d.outcome);if(mode==='player'&&d.player===playerId){lastHit=d.outcome;sound(d.outcome)}updateSpinner()}}}
function contestants(){return `<div class="list">${state.players.map((p,i)=>`<div class="person"><div class="dot" style="background:${p.color}"></div><b class="name">${i+1}. ${esc(p.name)}</b><span class="small">${p.ready?'✓ READY':'Waiting'}</span>${mode==='owner'?`<button class="btn danger" onclick="send('remove',{id:'${p.id}'})">×</button>`:''}</div>`).join('')}</div>`}
function owner(){let ready=state.players.length>0&&state.players.every(p=>p.ready);return `<div class="cols"><section class="panel"><h2>DM Control Booth</h2><p class="sub">Round ${state.showRound} · ${esc(state.status)}</p><button class="btn" ${!['lobby','pokemon_result'].includes(state.status)?'disabled':''} onclick="send('begin_round')">▶ BEGIN ${state.showRound?'NEXT ':''}ROUND</button><div class="divider"></div><p class="small">Dee's private selection link:</p><div class="linkbox">${esc(jessicaUrl())}</div><button class="btn secondary" onclick="navigator.clipboard.writeText(jessicaUrl())">Copy Dee's link</button><p class="small">TV stage link:</p><div class="linkbox">${esc(stageUrl())}</div><button class="btn secondary" onclick="navigator.clipboard.writeText(stageUrl())">Copy stage link</button><div class="divider"></div><div class="qrarea"><div class="qr"><img src="/qr/${room}"></div><div><div class="small">ROOM</div><div class="code">${room}</div></div></div><p class="small">Dee in Ohio needs the publicly hosted version; localhost is only for testing.</p></section><section class="panel"><h2>Contestants · ${state.players.length}/7</h2>${contestants()}<div class="divider"></div>${state.status==='waiting_jessica'?'<h2>Waiting for Dee to choose a Pokémon</h2>':state.status==='choosing'?`<p class="sub">Jessica selected <b>${esc(sel()?.nickname)}</b> (${esc(sel()?.name)}). Players see only the flavor hint.</p><button class="btn secondary" ${!state.players.length?'disabled':''} onclick="send('practice')">▶ TEST ROUND</button> <button class="btn" ${!ready?'disabled':''} onclick="send('start')">▶ BEGIN BLENDING</button><p class="small">${state.readyCount}/${state.players.length} Berries locked in</p>`:state.status==='block_result'?'<h2>Pokéblock made!</h2><button class="btn" onclick="send(\'reveal\')">REVEAL JESSICA’S POKÉMON</button>':state.status==='pokemon_result'?'<button class="btn" onclick="send(\'begin_round\')">NEXT ROUND</button>':state.status==='lobby'?'<p>Begin a round when everyone is ready.</p>':'<p class="sub">The blender is spinning!</p>'}<div class="divider"></div><button class="btn danger" onclick="if(confirm('Reset the entire game?'))send('reset')">RESET ENTIRE GAME</button></section></div>${state.status==='pokemon_result'?pokemonResult():state.status==='block_result'?blockResult():''}`}
function pokemonCards(){return `<div class="pokegrid">${(state.pokemonList||[]).map(p=>`<button class="pokechoice" ${p.used?'disabled':''} onclick="send('pokemon',{id:'${p.id}'})">${art(p)}<b>${esc(p.nickname)}</b><span class="small">${esc(p.name)}</span><span class="small">${p.used?'✓ Already featured':'Likes '+esc(p.likes)+' · '+esc(p.nature)}</span></button>`).join('')}</div>`}
function jessica(){return `<section class="panel center"><div class="eyebrow">JESSICA BILLY · PRIVATE SELECTION</div>${state.status==='waiting_jessica'?`<h2>Choose the hungry Pokémon for Round ${state.showRound}</h2>${pokemonCards()}`:sel()?`${art(sel(),'heroart')}<h2>${esc(sel().nickname)}</h2><p class="sub">${esc(sel().name)} · Prefers ${esc(sel().likes)}</p><p class="small">Selection locked! The DM controls the stage and start button.</p>`:`<h2>Waiting for the DM to begin Round ${state.showRound+1}</h2><p class="sub">Only you choose the Pokémon. No one sees your choice before the final reveal.</p>`}</section>`}
function berryGuide(){let flavor=state?.wantedFlavor||'Sweet';let desired={Spicy:'Cheri',Dry:'Chesto',Sweet:'Pecha',Bitter:'Rawst',Sour:'Aspear'}[flavor]||'Pecha';return `<div class="helpbox"><b>HOW TO MAKE THIS RECIPE</b><div>Target flavor: <strong style="color:var(--gold)">${esc(flavor)}</strong> → choose <strong style="color:var(--gold)">${desired} Berry</strong>.</div><div class="helpgrid">${B.slice(0,5).map(b=>`<div class="helpitem">${b[1]} <b>${b[2]}</b><br><small>${b[3]}</small></div>`).join('')}</div><small>Easy seven-player party recipe: at least half the players should choose the target-flavor Berry. Other Berries are allowed. Select your Berry, then press READY. You can coordinate with teammates.</small></div>`}
function primeStage(){audioPrimed=unlock();autoMusic=true;let b=$('music-toggle');if(b)b.textContent='♫ Sound ready · auto-play';let indicator=$('sound-ready');if(indicator)indicator.textContent='✓ Sound ready! Music will start with the spinner and play feedback sounds.'}
function stage(){if(state.status==='lobby')return `<section class="panel center"><h2>Welcome to the Berry Blender!</h2><div class="code">${room}</div><div class="qr" style="margin:auto"><img src="/qr/${room}"></div><p>Scan to join the game.</p>${contestants()}</section>`;if(state.status==='waiting_jessica')return `<section class="panel center"><div class="eyebrow">ROUND ${state.showRound}</div><div class="result">GET READY!</div><p class="sub">Jessica Billy is choosing tonight's mystery guest…</p></section>`;if(state.status==='choosing')return `<section class="panel center"><div class="eyebrow">ROUND ${state.showRound} · THE RECIPE HINT</div><div class="result">MYSTERY POKÉBLOCK</div><h2>${esc(state.hint||'Choose your Berries!')}</h2>${berryGuide()}<p class="sub">The Pokémon's identity stays secret until the reveal!</p><p>${state.readyCount} / ${state.players.length} contestants ready</p>${contestants()}</section>`;if(['practice','blending'].includes(state.status))return spinnerScreen();if(state.status==='block_result')return blockResult();return pokemonResult()}
function player(){let p=state.players.find(x=>x.id===playerId);if(!p)return '<section class="panel">Joining your seat…</section>';if(['practice','blending'].includes(state.status))return `<section class="panel control center"><h2>${esc(p.name)}</h2><p>Tap when the arrow reaches YOUR marker.</p><div class="dot" style="background:${p.color};width:42px;height:42px;margin:10px auto"></div><button id="press" class="bigpress" style="background:${p.color};color:#221333" onclick="press()">PRESS!</button><div id="feedback" class="result" style="font-size:32px;margin:30px">WATCH THE TV</div><p>Score: ${p.score}</p></section>`;if(state.status==='choosing')return `<div class="control"><section class="panel"><h2>Round ${state.showRound}: Pick a Berry</h2><p class="sub">${esc(state.hint||'Make a delicious Pokéblock!')}</p><input class="input" id="trainer" maxlength="22" value="${esc(p.name.startsWith('Trainer ')?'':p.name)}" placeholder="Trainer name"><button class="btn secondary" onclick="saveName()">Save name</button>${berryGuide()}<div class="berry-grid">${B.map(b=>`<button class="berry ${p.berry===b[0]?'on':''}" ${p.ready?'disabled':''} onclick="send('berry',{berry:'${b[0]}'})"><div class="emoji">${b[1]}</div><b>${b[2]}</b><small>${b[3]}</small></button>`).join('')}</div><p class="ready">${p.ready?'✓ READY — waiting for DM':'Choose a Berry first, then tap READY'}</p>${p.ready?`<button class="btn secondary" onclick="send('unready')">Change my Berry</button>`:`<button class="btn" ${!p.berry?'disabled':''} onclick="send('ready')">✓ READY UP</button>`}</section></div>`;return `<section class="panel center"><h2>${state.status==='waiting_jessica'?`Round ${state.showRound} is starting!`:'Waiting for the next stage…'}</h2><p class="sub">Keep your phone open. Your marker is <span style="color:${p.color}">●</span></p>${state.status==='block_result'?blockResult():''}${state.status==='pokemon_result'?pokemonResult():''}</section>`}
function saveName(){let n=$('trainer')?.value?.trim();if(n)send('join',{name:n})}
function press(){if(!spinning)return;let r=state?.revolution??0,k=(state?.practice?'P':'G')+r;if(lastPress===k)return;lastPress=k;lastHit='WAIT…';send('press');updateSpinner()}
function spinner(){const n=Math.max(1,state.players.length);return `<div class="arena"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="181" fill="#2b1b48" stroke="#e8c15f" stroke-width="9"/><circle cx="200" cy="200" r="153" fill="#62418d" stroke="#ac85d1" stroke-width="5"/>${state.players.map((p,i)=>{const a=i*2*Math.PI/n;const x=200+150*Math.sin(a),y=200-150*Math.cos(a);return `<circle cx="${x}" cy="${y}" r="22" fill="${p.color}" stroke="white" stroke-width="3"/><text x="${x}" y="${y+5}" font-size="14" font-weight="900" text-anchor="middle" fill="#21142e">${i+1}</text>`}).join('')}<g id="arrow" style="transform-origin:200px 200px"><line x1="200" y1="200" x2="200" y2="65" stroke="#ffe0a2" stroke-width="14" stroke-linecap="round"/><path d="M180 84 L200 44 L220 84" fill="#ffd073"/></g><circle cx="200" cy="200" r="29" fill="#efcb71" stroke="#ffe9b4" stroke-width="5"/><text x="200" y="209" text-anchor="middle" font-size="29" fill="#4d2870">✦</text></svg></div>`}
function spinnerScreen(){return `<div class="game-layout"><section class="panel center"><div class="eyebrow">ROUND ${state.showRound}${state.practice?' · PRACTICE':''}</div><h2>SPIN <span id="spin-number">${state.revolution+1}</span> / ${state.totalRevolutions}</h2>${spinner()}<p class="sub">The pointer gets faster with accurate presses!</p></section><section class="panel"><h2>Live scores</h2><div id="scores">${scoreboard()}</div><div class="divider"></div><h2>Commentary</h2><div id="commentary" class="log"></div></section></div>`}
function scoreboard(){return state.players.map(p=>`<div class="person"><span class="dot" style="background:${p.color}"></span><b class="name">${esc(p.name)}</b><b>${p.score} pts</b></div>`).join('')}
function blockResult(){let r=state.result;if(!r)return '<section class="panel center">Calculating Pokéblock…</section>';return `<section class="panel center"><div class="eyebrow">ROUND ${state.showRound} · THE POKÉBLOCK REVEAL</div><div class="result">${esc(r.color)} POKÉBLOCK!</div><h2>Level ${r.level} · Feel ${r.feel}</h2><p class="sub">${esc(r.quality)} blending · ${esc(r.flavor)} flavor · ${r.score}/${r.maxScore} points</p><p class="small">${esc(r.note)}</p><div class="helpbox">${r.targetCount} trainer(s) chose the target Berry; ${r.targetMinimum} needed to satisfy the mystery guest.</div><div class="divider"></div><h2>Scores</h2>${r.ranking.map(p=>`<span class="tag">${esc(p.name)}: ${p.score}</span>`).join('')}${mode==='owner'?'<div><button class="btn" onclick="send(\'reveal\')">REVEAL HUNGRY POKÉMON</button></div>':''}</section>`}
function pokemonResult(){let p=sel(),r=state.result;if(!p)return '';return `<section class="panel center"><div class="eyebrow">ROUND ${state.showRound} · THE HUNGRY GUEST</div>${art(p,'heroart')}<h2>${esc(p.nickname)} · ${esc(p.name)}</h2><p class="sub">Favorite flavor: <b>${esc(p.likes)}</b> · ${esc(p.nature)} Nature</p><button class="btn secondary" onclick="playCry(state.pokemon)">♪ PLAY POKÉMON CRY</button><h2 style="margin-top:20px">${r?.recipeSuccess?'The Pokéblock suits their taste!':'Not quite their favorite flavor!'}</h2>${mode==='owner'?'<button class="btn" onclick="send(\'begin_round\')">▶ NEXT ROUND</button>':''}</section>`}
function updateSpinner(){if(!state)return;if($('arrow'))$('arrow').style.transform=`rotate(${angle*180/Math.PI}deg)`;if($('spin-number'))$('spin-number').textContent=Math.min(state.revolution+1,state.totalRevolutions);if($('scores'))$('scores').innerHTML=scoreboard();if($('commentary'))$('commentary').innerHTML=state.events.slice(-12).reverse().map(e=>`<div>${esc(e)}</div>`).join('');if(mode==='player'&&['blending','practice'].includes(state.status)){let r=state.revolution,k=(state.practice?'P':'G')+r;if(lastRevolution!==r){lastRevolution=r;lastPress='';lastHit=''}if($('press'))$('press').disabled=!spinning||lastPress===k;if($('feedback'))$('feedback').textContent=lastHit||'WATCH THE TV'}}
function render(){if(!state){$('main').innerHTML=mode==='player'&&!room?`<section class="panel control"><h2>Join game</h2><input class="input" id="roomcode" placeholder="Room code"><button class="btn" onclick="location.href='/play?room='+encodeURIComponent($('roomcode').value.toUpperCase())">Join</button></section>`:'<section class="panel">Connecting…</section>';return}let screen=mode+'-'+state.status;if(screen===active&&['practice','blending'].includes(state.status)){updateSpinner();return}active=screen;$('main').innerHTML=mode==='owner'?owner():mode==='jessica'?jessica():mode==='stage'?stage():player();updateSpinner()}
render();if(room||mode==='owner')connect();
</script></body></html>
